version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint has no release supporting TypeScript 7: its peer range
      # is ">=4.8.4 <6.1.0", and eslint-config-next pulls it in transitively, so
      # a TS 7 bump fails lint with "typescript-eslint does not support TS 7.0"
      # (PR #63). Because every npm update is grouped into one PR, that single
      # incompatibility blocks every other update in the group.
      # Remove this entry once typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
